---
- name: Verify Docker group membership
  ansible.builtin.command:
    cmd: id -nG {{ minikube_user }}
  register: minikube_user_groups
  changed_when: false

- name: Stop if the user is not in the Docker group
  ansible.builtin.assert:
    that:
      - "'docker' in minikube_user_groups.stdout.split()"
    fail_msg: >-
      User {{ minikube_user }} does not belong to the docker group.
    success_msg: >-
      User {{ minikube_user }} can use Docker.

- name: Check Docker access without sudo
  ansible.builtin.command:
    cmd: docker info
  become: true
  become_user: "{{ minikube_user }}"
  environment:
    HOME: "{{ minikube_user_home }}"
  changed_when: false

- name: Check Minikube cluster status
  ansible.builtin.command:
    cmd: minikube status --profile {{ minikube_profile }}
  become: true
  become_user: "{{ minikube_user }}"
  environment:
    HOME: "{{ minikube_user_home }}"
  register: minikube_cluster_status
  changed_when: false
  failed_when: false

- name: Create Minikube cluster
  ansible.builtin.command:
    cmd: >-
      minikube start
      --profile={{ minikube_profile }}
      --driver={{ minikube_driver }}
      --cpus={{ minikube_cpus }}
      --memory={{ minikube_memory }}
      --disk-size={{ minikube_disk_size }}
      --kubernetes-version={{ minikube_kubernetes_version }}
      --container-runtime=containerd
  become: true
  become_user: "{{ minikube_user }}"
  environment:
    HOME: "{{ minikube_user_home }}"
  when: minikube_cluster_status.rc != 0
  register: minikube_cluster_created
  changed_when: minikube_cluster_status.rc != 0

- name: Select Minikube Kubernetes context
  ansible.builtin.command:
    cmd: minikube profile {{ minikube_profile }}
  become: true
  become_user: "{{ minikube_user }}"
  environment:
    HOME: "{{ minikube_user_home }}"
  changed_when: false

- name: Wait for Kubernetes node to become ready
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Ready node --all --timeout=300s
  become: true
  become_user: "{{ minikube_user }}"
  environment:
    HOME: "{{ minikube_user_home }}"
    KUBECONFIG: "{{ minikube_user_home }}/.kube/config"
  changed_when: false

- name: Obtain Kubernetes nodes
  ansible.builtin.command:
    cmd: kubectl get nodes -o wide
  become: true
  become_user: "{{ minikube_user }}"
  environment:
    HOME: "{{ minikube_user_home }}"
    KUBECONFIG: "{{ minikube_user_home }}/.kube/config"
  register: kubernetes_nodes
  changed_when: false

- name: Obtain Kubernetes system pods
  ansible.builtin.command:
    cmd: kubectl get pods --all-namespaces
  become: true
  become_user: "{{ minikube_user }}"
  environment:
    HOME: "{{ minikube_user_home }}"
    KUBECONFIG: "{{ minikube_user_home }}/.kube/config"
  register: kubernetes_system_pods
  changed_when: false

- name: Display Kubernetes validation
  ansible.builtin.debug:
    msg:
      - "{{ kubernetes_nodes.stdout_lines }}"
      - "{{ kubernetes_system_pods.stdout_lines }}"
