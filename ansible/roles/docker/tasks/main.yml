---
- name: Verify that the managed system is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_architecture in ["x86_64", "aarch64"]
    fail_msg: >-
      This Docker role only supports Ubuntu systems
      on x86_64 or ARM64 architectures.
    success_msg: >-
      Compatible Ubuntu system detected:
      {{ ansible_distribution }} {{ ansible_distribution_version }}
      on {{ ansible_architecture }}.

- name: Detect Debian package architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: docker_dpkg_architecture
  changed_when: false

- name: Display detected Docker repository parameters
  ansible.builtin.debug:
    msg:
      - "Ubuntu release: {{ ansible_distribution_release }}"
      - "Package architecture: {{ docker_dpkg_architecture.stdout }}"

- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: false

- name: Install Docker repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Configure official Docker APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ docker_dpkg_architecture.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker service
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Add remote user to Docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - docker
    append: true

- name: Verify that Docker service is active
  ansible.builtin.command:
    cmd: systemctl is-active docker
  register: docker_service_status
  changed_when: false
  failed_when: docker_service_status.stdout != "active"

- name: Obtain Docker version
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false

- name: Obtain Docker Compose version
  ansible.builtin.command:
    cmd: docker compose version
  register: docker_compose_version
  changed_when: false

- name: Display Docker installation result
  ansible.builtin.debug:
    msg:
      - "Docker service: {{ docker_service_status.stdout }}"
      - "{{ docker_version.stdout }}"
      - "{{ docker_compose_version.stdout }}"
      - "User {{ ansible_user }} was added to the docker group."
